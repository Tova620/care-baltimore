<nav class="relative">

  <!-- Overlay -->
  <div class="absolute inset-0 bg-black opacity-40"></div>

  <!-- DESKTOP NAVBAR -->
  <mat-toolbar class="relative z-10 desktop-nav bg-gradient-to-r from-blue-400 via-indigo-500 to-purple-600 text-white">
    <img src="./assets/care-logo.jpg" routerLink="/" alt="logo"
         class="h-12 mr-4 border rounded-lg cursor-pointer">

    <button mat-button routerLink="/" class="text-white nav-btn">
      <span class="hidden sm:inline">Home</span>
      <span class="sm:hidden">Home</span>
    </button>
    <button mat-button routerLink="/join-our-volunteers" class="text-white nav-btn">
      <span class="hidden sm:inline">Become a Volunteer</span>
      <span class="sm:hidden">Volunteer</span>
    </button>
    <button mat-button routerLink="/sign-up-for-visits" class="text-white nav-btn">
      <span class="hidden sm:inline">Sign up for Visits</span>
      <span class="sm:hidden">Visits</span>
    </button>
    <button *ngIf="(authService.currentUser$ | async)" mat-button routerLink="/visit-log" class="text-white nav-btn">
      <span class="hidden sm:inline">Visit Log</span>
      <span class="sm:hidden">Log</span>
    </button>
    
    <span class="flex-1"></span>
    
    <button *ngIf="!(authService.currentUser$ | async)" mat-button routerLink="/sign-in" class="text-white nav-btn">
      Sign In
    </button>
    <button *ngIf="(authService.currentUser$ | async)" mat-button (click)="signOut()" class="text-white nav-btn">
      Sign Out
    </button>
  </mat-toolbar>

  <!-- MOBILE NAVBAR -->
  <mat-toolbar class="relative z-10 mobile-nav bg-gradient-to-r from-blue-400 via-indigo-500 to-purple-600 text-white">
    <img src="./assets/care-logo.jpg" routerLink="/" alt="logo"
         class="h-10 mr-2 border rounded-lg cursor-pointer">

    <span class="spacer"></span>

    <button *ngIf="!(authService.currentUser$ | async)" mat-button routerLink="/sign-in" class="text-white text-sm">
      Sign In
    </button>
    <button *ngIf="(authService.currentUser$ | async)" mat-button (click)="signOut()" class="text-white text-sm">
      Sign Out
    </button>

    <button mat-icon-button (click)="drawer.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
  </mat-toolbar>

  <mat-sidenav-container class="mobile-sidenav-container">
    <mat-sidenav #drawer mode="over" class="mobile-sidenav">
      <mat-nav-list>
        <a mat-list-item routerLink="/" (click)="drawer.close()">Home</a>
        <a mat-list-item routerLink="/join-our-volunteers" (click)="drawer.close()">Join our Volunteers</a>
        <a mat-list-item routerLink="/sign-up-for-visits" (click)="drawer.close()">Sign up for Visits</a>
        <a *ngIf="(authService.currentUser$ | async)" mat-list-item routerLink="/visit-log" (click)="drawer.close()">Visit Log</a>
      </mat-nav-list>
    </mat-sidenav>
  </mat-sidenav-container>

</nav>
