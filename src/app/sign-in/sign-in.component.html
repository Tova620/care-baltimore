<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
  <div class="bg-white rounded-lg shadow-xl p-8 max-w-md w-full">
    <h2 class="text-3xl font-bold text-center text-indigo-600 mb-6">Volunteer Sign In</h2>
    
    <form [formGroup]="signInForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
        <input 
          type="email" 
          formControlName="email" 
          placeholder="your@email.com"
          (blur)="checkEmail()"
          class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none">
        <div *ngIf="emailErrorMessage" class="text-red-600 text-sm mt-1">
          {{ emailErrorMessage }}
        </div>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-2">{{ passwordLabel }}</label>
        <input 
          type="password" 
          formControlName="password" 
          [placeholder]="passwordPlaceholder"
          class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none">
      </div>

      <div *ngIf="errorMessage" class="text-red-600 text-sm mb-4">
        {{ errorMessage }}
      </div>

      <button mat-raised-button color="primary" type="submit" [disabled]="!signInForm.valid" class="w-full">
        Sign In
      </button>
    </form>

    <p class="text-center text-gray-600 text-sm mt-4">
      Only registered volunteers can sign in
    </p>
  </div>
</div>
