<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
  <div class="bg-white rounded-lg shadow-xl p-8 max-w-md w-full">
    <h2 class="text-3xl font-bold text-center text-indigo-600 mb-2">Create Your Password</h2>
    <p class="text-center text-gray-600 text-sm mb-6">Set up your password to access your volunteer account</p>

    <form [formGroup]="createPasswordForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
        <input
          type="email"
          formControlName="email"
          placeholder="Your registered email"
          class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none">
      </div>

      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
        <input
          type="password"
          formControlName="password"
          placeholder="Create a password (min 6 characters)"
          class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none">
      </div>

      <div *ngIf="errorMessage" class="text-red-600 text-sm mb-4">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="text-green-600 text-sm mb-4">
        {{ successMessage }}
      </div>

      <button mat-raised-button color="primary" type="submit" [disabled]="!createPasswordForm.valid" class="w-full mb-3">
        Create Password & Sign In
      </button>

      <button mat-button type="button" (click)="goToSignIn()" class="w-full">
        Back to Sign In
      </button>
    </form>

    <p class="text-center text-gray-600 text-xs mt-4">
      Only registered volunteers can create passwords
    </p>
  </div>
</div>
